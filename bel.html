            if (algoChaptersDiv.style.display === 'block') {
                algoChaptersDiv.style.display = 'none';
                btnSubjectAlgorithms.textContent = '🧮 Subject: Algorithms ▼';
            } else {
                algoChaptersDiv.style.display = 'block';
                btnSubjectAlgorithms.textContent = '🧮 Subject: Algorithms ▲';
            }
        }

        /**
         * Starts the quiz with the specified dataset and title.
         */
        function startQuiz(dataset, title) {
            currentQuizData = dataset; // Load the specific questions
            quizTitleEl.textContent = title; // Update header title

            // Reset Stats
            currentQuestionIndex = 0;
            score = 0;
            wrongAnswers = 0;
            updateScoreboard();

            // Switch Screens
            homeScreen.style.display = 'none';
            quizContainer.style.display = 'block';

            loadQuestion();
        }

        function loadQuestion() {
            answerChecked = false;
            selectedOption = null;
            explanationEl.style.display = 'none';
            optionsListEl.innerHTML = '';
            checkAnswerBtn.disabled = true;
            checkAnswerBtn.style.display = 'block';
            nextQuestionBtn.style.display = 'none';

            const question = currentQuizData[currentQuestionIndex];

            questionNumberEl.textContent = `Question ${currentQuestionIndex + 1} / ${currentQuizData.length}`;
            questionTextEl.textContent = question.question;

            question.options.forEach((option, index) => {
                const li = document.createElement('li');
                li.className = 'option';
                li.textContent = option;
                li.dataset.index = index;
                li.addEventListener('click', () => selectOption(li));
                optionsListEl.appendChild(li);
            });
        }

        function selectOption(clickedOption) {
            if (answerChecked) return;
            const currentlySelected = document.querySelector('.option.selected');
            if (currentlySelected) currentlySelected.classList.remove('selected');
            clickedOption.classList.add('selected');
            selectedOption = clickedOption;
            checkAnswerBtn.disabled = false;
        }

        function checkAnswer() {
            if (!selectedOption) return;
            answerChecked = true;
            checkAnswerBtn.disabled = true;
            checkAnswerBtn.style.display = 'none';
            nextQuestionBtn.style.display = 'block';

            const selectedIndex = parseInt(selectedOption.dataset.index);
            const question = currentQuizData[currentQuestionIndex];
            const correctIndex = question.correct;

            const explanationText = document.createElement('p');
            explanationText.innerHTML = question.explanation;
            explanationEl.innerHTML = '';

            const correctOptionEl = optionsListEl.querySelector(`[data-index='${correctIndex}']`);

            if (selectedIndex === correctIndex) {
                score += 1;
                selectedOption.classList.add('correct');
                explanationEl.className = 'correct'; // Use className to reset other classes
                explanationEl.innerHTML = '<strong style="color:#155724">Correct!</strong>';
            } else {
                score -= 0.25;
                wrongAnswers += 1;
                selectedOption.classList.add('wrong');
                if (correctOptionEl) correctOptionEl.classList.add('correct');
                explanationEl.className = 'wrong';
                explanationEl.innerHTML = '<strong style="color:#721c24">Wrong. The correct answer was highlighted.</strong>';
            }

            explanationEl.appendChild(explanationText);
            explanationEl.style.display = 'block';
            updateScoreboard();
        }

        function updateScoreboard() {
            scoreEl.textContent = score.toFixed(2);
            wrongEl.textContent = wrongAnswers;
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < currentQuizData.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            quizBodyEl.style.display = 'none';
            quizFooterEl.style.display = 'none';
            resultsScreenEl.style.display = 'block';
            finalScoreEl.textContent = `Your Score: ${score.toFixed(2)}`;
            resultsSummaryEl.textContent = `You answered ${wrongAnswers} questions incorrectly out of ${currentQuizData.length}.`;
        }

        function restartQuiz() {
            // Reset UI
            resultsScreenEl.style.display = 'none';
            quizContainer.style.display = 'none';
            quizBodyEl.style.display = 'block';
            quizFooterEl.style.display = 'block';

            // Go back to Home
            homeScreen.style.display = 'block';
        }

        // --- 5. EVENT LISTENERS ---

        // Menu Buttons
        btnSubjectAlgorithms.addEventListener('click', toggleAlgorithmsMenu);

        // Start Buttons
        btn2023Paper.addEventListener('click', () => {
            startQuiz(paper2023Data, "2023 Practice Quiz");
        });

        btnAlgoCh1.addEventListener('click', () => {
            startQuiz(algoChapter1Data, "Algorithms: Chapter 1");
        });

        // Quiz Controls
        checkAnswerBtn.addEventListener('click', checkAnswer);
        nextQuestionBtn.addEventListener('click', nextQuestion);
        restartBtn.addEventListener('click', restartQuiz);

    </script>
</body>

</html>
